<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DinhRise Hotel</title>
    <!-- Prevent favicon request -->
    <link rel="icon" href="data:,">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Custom JS -->
    <script src="js/register.js" defer></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex">
        <!-- Left Side - Image -->
        <div class="hidden lg:flex lg:w-1/2 relative">
            <div class="absolute inset-0 bg-black bg-opacity-50 z-10"></div>
            <img src="https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80" 
                 alt="DinhRise Hotel" 
                 class="w-full h-full object-cover">
            <div class="absolute inset-0 flex items-center justify-center z-20 text-white px-12">
                <div data-aos="fade-right">
                    <h1 class="text-4xl font-bold mb-4">Join DinhRise Hotel</h1>
                    <p class="text-xl mb-8">Experience luxury and comfort in the heart of the city</p>
                    <div class="flex space-x-4">
                        <div class="text-center">
                            <i class="fas fa-star text-3xl mb-2"></i>
                            <p>5-Star Rating</p>
                        </div>
                        <div class="text-center">
                            <i class="fas fa-award text-3xl mb-2"></i>
                            <p>Best Service</p>
                        </div>
                        <div class="text-center">
                            <i class="fas fa-heart text-3xl mb-2"></i>
                            <p>Guest Favorite</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Register Form -->
        <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
            <div class="w-full max-w-md" data-aos="fade-left">
                <div class="text-center mb-8">
                    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111320.png" alt="Hotel Logo" class="h-16 mx-auto mb-4">
                    <h2 class="text-3xl font-bold text-gray-900">Create Account</h2>
                    <p class="text-gray-600">Choose your account type</p>
                </div>

                <!-- Error Alert -->
                <div id="errorAlert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" id="errorMessage"></span>
                    <span class="absolute top-0 bottom-0 right-0 px-4 py-3">
                        <i class="fas fa-times cursor-pointer" onclick="hideError()"></i>
                    </span>
                </div>

                <!-- Form Tabs -->
                <div class="flex mb-6 rounded-lg overflow-hidden border border-gray-200">
                    <button id="customerTab" class="form-tab flex-1 py-2 px-4 text-center font-medium active">
                        <i class="fas fa-user mr-2"></i>Customer
                    </button>
                    <button id="employeeTab" class="form-tab flex-1 py-2 px-4 text-center font-medium">
                        <i class="fas fa-briefcase mr-2"></i>Employee
                    </button>
                </div>

                <!-- Customer Registration Form -->
                <form id="customerForm" class="space-y-6">
                    <div class="input-group">
                        <input type="text" 
                               id="customerIdentityId" 
                               name="identityId" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="customerIdentityId" class="floating-label">Identity ID</label>
                        <i class="fas fa-id-card"></i>
                    </div>

                    <div class="input-group">
                        <input type="text" 
                               id="customerUsername" 
                               name="username" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="customerUsername" class="floating-label">Username</label>
                        <i class="fas fa-user"></i>
                    </div>

                    <div class="input-group">
                        <input type="text" 
                               id="customerName" 
                               name="name" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="customerName" class="floating-label">Full Name</label>
                        <i class="fas fa-user-circle"></i>
                    </div>

                    <div class="input-group">
                        <input type="tel" 
                               id="customerPhone" 
                               name="phone" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="customerPhone" class="floating-label">Phone Number</label>
                        <i class="fas fa-phone"></i>
                    </div>

                    <div class="input-group">
                        <input type="email" 
                               id="customerEmail" 
                               name="email" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="customerEmail" class="floating-label">Email</label>
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="input-group">
                        <input type="date" 
                               id="customerDob" 
                               name="dob" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="customerDob" class="floating-label">Date of Birth</label>
                        <i class="fas fa-calendar"></i>
                    </div>

                    <div class="input-group">
                        <select id="customerGender" 
                                name="gender" 
                                class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
                            <option value="">Select Gender</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <option value="OTHER">Other</option>
                        </select>
                        <label for="customerGender" class="floating-label">Gender</label>
                        <i class="fas fa-venus-mars"></i>
                    </div>

                    <div class="input-group">
                        <input type="text" 
                               id="customerAddress" 
                               name="address" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="customerAddress" class="floating-label">Address</label>
                        <i class="fas fa-map-marker-alt"></i>
                    </div>

                    <div class="input-group">
                        <input type="password" 
                               id="customerPassword" 
                               name="password" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="customerPassword" class="floating-label">Password</label>
                        <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-indigo-500" onclick="togglePassword('customerPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <div class="input-group">
                        <input type="password" 
                               id="customerConfirmPassword" 
                               name="confirmPassword" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="customerConfirmPassword" class="floating-label">Confirm Password</label>
                        <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-indigo-500" onclick="togglePassword('customerConfirmPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <button type="submit" class="btn-primary w-full bg-indigo-600 text-white py-3 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                        Register as Customer
                    </button>
                </form>

                <!-- Employee Registration Form -->
                <form id="employeeForm" class="space-y-6 hidden">
                    <div class="input-group">
                        <input type="text" 
                               id="employeeName" 
                               name="name" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="employeeName" class="floating-label">Full Name</label>
                        <i class="fas fa-user-circle"></i>
                    </div>

                    <div class="input-group">
                        <input type="text" 
                               id="employeeUsername" 
                               name="username" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="employeeUsername" class="floating-label">Username</label>
                        <i class="fas fa-user"></i>
                    </div>

                    <div class="input-group">
                        <input type="email" 
                               id="employeeEmail" 
                               name="email" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="employeeEmail" class="floating-label">Email</label>
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="input-group">
                        <input type="tel" 
                               id="employeePhone" 
                               name="phone" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="employeePhone" class="floating-label">Phone Number</label>
                        <i class="fas fa-phone"></i>
                    </div>

                    <div class="input-group">
                        <input type="text" 
                               id="employeeIdentityId" 
                               name="identityId" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="employeeIdentityId" class="floating-label">Identity ID</label>
                        <i class="fas fa-id-card"></i>
                    </div>

                    <div class="input-group">
                        <input type="date" 
                               id="employeeDob" 
                               name="dob" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="employeeDob" class="floating-label">Date of Birth</label>
                        <i class="fas fa-calendar"></i>
                    </div>

                    <div class="input-group">
                        <select id="employeeGender" 
                                name="gender" 
                                class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
                            <option value="">Select Gender</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <option value="OTHER">Other</option>
                        </select>
                        <label for="employeeGender" class="floating-label">Gender</label>
                        <i class="fas fa-venus-mars"></i>
                    </div>

                    <div class="input-group">
                        <input type="text" 
                               id="employeeAddress" 
                               name="address" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="employeeAddress" class="floating-label">Address</label>
                        <i class="fas fa-map-marker-alt"></i>
                    </div>

                    <div class="input-group">
                        <select id="employeeRole" 
                                name="role" 
                                class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
                            <option value="">Select Role</option>
                            <option value="RECEPTIONIST">Receptionist</option>
                            <option value="CLEANER">Cleaner</option>
                            <option value="WAITER">Waiter</option>
                            <option value="ACCOUNTANT">Accountant</option>
                            <option value="DEPARTMENT_HEAD">Department Head</option>
                        </select>
                        <label for="employeeRole" class="floating-label">Role</label>
                        <i class="fas fa-briefcase"></i>
                    </div>

                    <div class="input-group">
                        <input type="password" 
                               id="employeePassword" 
                               name="password" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="employeePassword" class="floating-label">Password</label>
                        <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-indigo-500" onclick="togglePassword('employeePassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <div class="input-group">
                        <input type="password" 
                               id="employeeConfirmPassword" 
                               name="confirmPassword" 
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                               placeholder=" ">
                        <label for="employeeConfirmPassword" class="floating-label">Confirm Password</label>
                        <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-indigo-500" onclick="togglePassword('employeeConfirmPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <button type="submit" class="btn-primary w-full bg-indigo-600 text-white py-3 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                        Register as Employee
                    </button>
                </form>

                <div class="text-center mt-6">
                    <p class="text-sm text-gray-600">
                        Already have an account?
                        <a href="/login.html" class="font-medium text-indigo-600 hover:text-indigo-500">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
