application:
  name: hotel-system-management

server:
  port: 8080
  ssl:
    enabled: false
    key-store: classpath:keystore.jks
    key-store-password:
    key-store-type: JKS
    key-alias: myssl
    key-password:

spring:
  ai:
    openai:
      api-key:
      chat:
        base-url: "https://generativelanguage.googleapis.com/v1beta/openai/"
        completions-path: "/v1beta/openai/chat/completions"
        options:
          model: gemini-2.0-flash
          temperature: 0.7
  config:
    import: optional:application-secret.yaml
  mail:
    host: smtp.gmail.com
    port: 587
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  data:
    redis:
      host: localhost
      port: 6379
  mvc:
    static-path-pattern: /**
  web:
    resources:
      static-locations: classpath:/static/
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://localhost:3306/hotel_database_management
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

paypal:
  mode: sandbox
  client-id:
  client-secret:
  cancel-url: "http://localhost:5173/payment-cancel"
  success-url: "http://localhost:5173/payment-result"
  error-url: "http://localhost:5173/payment-error"

zalo-pay:
  app-id:
  key1:
  key2:
  create-order-url: "https://sb-openapi.zalopay.vn/v2/create"
  order-status-url: "https://sb-openapi.zalopay.vn/v2/query"
  redirect-url: "http://localhost:5173/payment-result"
  callback-url: ${ZALO_CALLBACK_URL:http://localhost:8080/zalopay/callback}

jwt:
  signerKey:
  valid-duration: 15 #in 15 minutes
  # Refresh Token mặc định (Không chọn Remember Me): 1 ngày (1440 phút)
  refreshable-duration: 1440

  # Refresh Token khi CÓ Remember Me: 14 ngày (20160 phút)
  remember-me-duration: 20160

minio:
  url: http://minio:9000
  external-url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: hotel-images